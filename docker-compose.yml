name: ideaforge

services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdeaForgeDb: "Host=${IDEA_FORGE_DB_HOST:-host.docker.internal};Port=${IDEA_FORGE_DB_PORT:-5432};Database=${IDEA_FORGE_DB_NAME:-IDEA_FORGE_DB};Username=${IDEA_FORGE_DB_USER:-postgres};Password=${IDEA_FORGE_DB_PASSWORD:-CMD!368}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${IDEA_FORGE_HTTP_PORT:-5246}:8080"
